<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="glow" x1="120" y1="100" x2="392" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <!-- Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#glow)" stroke-width="4"/>

  <!-- Graduation Cap Top -->
  <path d="M256 112L116 176L256 240L396 176L256 112Z" fill="#FFFFFF"/>
  <!-- Tassel -->
  <path d="M372 187V244" stroke="#FDE047" stroke-width="12" stroke-linecap="round"/>
  <circle cx="372" cy="252" r="10" fill="#FDE047"/>

  <!-- Clock Ring integrated below cap -->
  <circle cx="256" cy="316" r="96" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-width="20"/>
  <!-- Clock Hands -->
  <path d="M256 264V316L294 340" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="316" r="12" fill="#FDE047"/>
</svg>
